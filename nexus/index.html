<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050511" />
    <meta name="description" content="Sistema de Gestão Jurídica Inteligente - Nexus" />
    <title>Nexus - Legal Suite</title>
    <script>
        // Clear any registered service workers from this origin to prevent cache-related white screens
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (const registration of registrations) {
                    registration.unregister().then(success => {
                        if (success) console.log('Service Worker unregistered successfully.');
                    });
                }
            }).catch(err => {
                console.error('Error unregistering service worker:', err);
            });
        }
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
