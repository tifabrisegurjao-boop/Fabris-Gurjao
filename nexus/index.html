    <script>
        // Clear any registered service workers from this origin to prevent cache-related white screens
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (const registration of registrations) {
                    registration.unregister().then(success => {
                        if (success) console.log('Service Worker unregistered successfully.');
                    });
                }
            }).catch(err => {
                console.error('Error unregistering service worker:', err);
            });
        }
    </script>
