<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Portal de Sistemas Jurídicos Integrados - Fabris & Gurjão Advogados" />
    <title>Portal de Sistemas - Fabris & Gurjão Advogados</title>
    <script>
        // Check if splash has been played in this session to prevent reload flash
        if (sessionStorage.getItem('portalSplashPlayed')) {
            document.documentElement.classList.add('splash-played');
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark-1: #030813;
            --bg-dark-2: #08162e; /* Exact Brand Navy */
            --bg-dark-3: #02050b;
            --gold-light: #dfc083; /* Premium metallic light gold */
            --gold-mid: #c5a059; /* Brand Gold */
            --gold-dark: #9e7f44; /* Darker Gold */
            --gold-glow: rgba(197, 160, 89, 0.08);
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --glass-bg: rgba(8, 22, 46, 0.65);
            --glass-border: rgba(197, 160, 89, 0.18);
            --glass-border-hover: rgba(197, 160, 89, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, var(--bg-dark-2) 0%, var(--bg-dark-1) 50%, var(--bg-dark-3) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* Ambient Glow Behind Crest */
        .ambient-glow {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(50px);
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Container */
        .portal-container {
            width: 100%;
            max-width: 1100px;
            padding: 50px 24px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fade-in 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header / Logo Section */
        .header-section {
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .brand-crest-wrapper {
            margin: 0 auto;
            width: 120px;
            height: 132px;
            color: var(--gold-mid);
            opacity: 0.95;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(197, 160, 89, 0.35));
        }

        .brand-crest-wrapper:hover {
            transform: scale(1.08);
            color: var(--gold-light);
            filter: drop-shadow(0 0 35px rgba(223, 192, 131, 0.65));
        }


        /* Systems Selection Grid */
        .systems-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 520px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .systems-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Card Styles */
        .system-card {
            background: linear-gradient(145deg, rgba(8, 22, 46, 0.45), rgba(3, 8, 19, 0.7));
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px 20px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.02);
        }

        /* Divider Line Below Crest */
        .divider {
            width: 120px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-mid), transparent);
            margin: 16px auto 28px auto;
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: -2.5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: var(--gold-mid);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold-light);
        }


        .system-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(223, 192, 131, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .system-card:hover {
            transform: translateY(-6px);
            border-color: var(--glass-border-hover);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5), 0 0 20px rgba(197, 160, 89, 0.1);
        }

        .system-card:hover::before {
            opacity: 1;
        }

        .card-icon-wrapper {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: rgba(197, 160, 89, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            color: var(--gold-mid);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .system-card:hover .card-icon-wrapper {
            background: rgba(197, 160, 89, 0.08);
            color: var(--gold-light);
            transform: scale(1.06);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
            border-color: rgba(197, 160, 89, 0.35);
        }

        .card-icon-wrapper svg {
            width: 38px;
            height: 38px;
            transition: all 0.4s ease;
        }

        .system-card:hover .card-icon-wrapper svg {
            transform: scale(1.05);
            filter: drop-shadow(0 0 6px rgba(197, 160, 89, 0.35));
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            letter-spacing: 0.06em;
            transition: color 0.3s ease;
        }

        .system-card:hover .card-title {
            color: var(--gold-light);
        }


        .card-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-mid) 100%);
            color: #030813; /* Dark background color for high premium contrast */
            font-family: 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.15);
        }

        .system-card:hover .card-button {
            transform: scale(1.05);
            background: linear-gradient(135deg, var(--gold-mid) 0%, var(--gold-light) 100%);
            box-shadow: 0 6px 20px rgba(197, 160, 89, 0.3);
        }


        /* Footer */
        footer {
            margin-top: auto;
            padding: 40px 24px 20px 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            z-index: 10;
        }

        footer a {
            color: var(--gold-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Transition Video Overlay */
        .video-overlay {
            position: fixed;
            inset: 0;
            background-color: #030813;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-played .video-overlay {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .video-overlay video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Fallback loader when video doesn't load or plays slowly */
        .transition-fallback {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: pulse-slow 2s infinite ease-in-out;
        }
        
        .transition-loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(197, 160, 89, 0.1);
            border-top: 3px solid var(--gold-light);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <div class="portal-container">
        <!-- Logo/Header -->
        <header class="header-section">
            <!-- Dynamic Brand Crest SVG (Official scales of the firm) -->
            <div class="brand-crest-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37.92 41.87" class="brand-crest" style="width: 100%; height: 100%; fill: currentColor; filter: drop-shadow(0 0 12px rgba(197, 160, 89, 0.4));">
                    <path id="Path_58" data-name="Path 58" d="M428.626,119.712l7.9-7.9,10.319,10.318-1.581,1.58-15.8,15.8,3.949,3.949-1.58,1.581-3.949-3.95-3.951,3.95-1.58-1.58,3.951-3.95-15.8-15.8-1.579-1.58,18.96-18.96,5.529,5.53-1.58,1.58-1.58,1.58-1.579-1.58,1.579-1.58-2.369-2.37-15.8,15.8,7.062,7.063,4.74-4.741-1.579-1.58,1.579-1.58,1.58,1.58,1.581,1.58-6.32,6.32,7.158,7.159,15.8-15.8-7.158-7.158-4.74,4.74,1.58,1.58-1.58,1.58-1.58-1.58Z" transform="translate(-408.924 -103.169)"></path>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Fabris & Gurjão Advogados Associados. Todos os direitos reservados.</p>
    </footer>

    <!-- Video Transition Overlay -->
    <div id="video-transition-overlay" class="video-overlay">
        <!-- Servindo o vídeo intro.mp4 a partir da raiz (public/intro.mp4) de forma absoluta -->
        <video id="transition-video" src="/intro.mp4" muted playsinline></video>
        <div id="video-fallback" class="transition-fallback" style="display: none;">
            <div class="transition-loader"></div>
            <p style="font-family: 'Inter', sans-serif; font-size: 0.75rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold-light); font-weight: 600;">Carregando Portal...</p>
        </div>
        <button id="skip-splash" style="
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f9fafb;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        ">Pular</button>
    </div>

    <script>
        // Clear any registered service workers from this origin to prevent cache issues
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (const registration of registrations) {
                    registration.unregister().then(success => {
                        if (success) console.log('Service Worker unregistered successfully.');
                    });
                }
            }).catch(err => {
                console.error('Error unregistering service worker:', err);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('video-transition-overlay');
            const video = document.getElementById('transition-video');
            const fallback = document.getElementById('video-fallback');
            const skipButton = document.getElementById('skip-splash');

            const hasPlayed = sessionStorage.getItem('portalSplashPlayed');

            function finishSplash() {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
                sessionStorage.setItem('portalSplashPlayed', 'true');
                document.documentElement.classList.add('splash-played');
                
                try {
                    video.pause();
                } catch(e) {}

                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 800);
            }

            if (hasPlayed) {
                overlay.style.display = 'none';
                return;
            }

            video.load();

            const fallbackTimeout = setTimeout(() => {
                if (fallback) fallback.style.display = 'flex';
            }, 1500);

            const safetyTimeout = setTimeout(() => {
                finishSplash();
            }, 6000);

            video.play()
                .then(() => {
                    clearTimeout(fallbackTimeout);
                    if (fallback) fallback.style.display = 'none';
                    
                    video.onended = () => {
                        clearTimeout(safetyTimeout);
                        finishSplash();
                    };
                })
                .catch(err => {
                    console.warn("Video autoplay blocked or failed, skipping splash:", err);
                    clearTimeout(fallbackTimeout);
                    clearTimeout(safetyTimeout);
                    finishSplash();
                });

            if (skipButton) {
                skipButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    clearTimeout(fallbackTimeout);
                    clearTimeout(safetyTimeout);
                    finishSplash();
                });
            }

            overlay.addEventListener('click', () => {
                clearTimeout(fallbackTimeout);
                clearTimeout(safetyTimeout);
                finishSplash();
            });
        });
    </script>
</body>

</html>
